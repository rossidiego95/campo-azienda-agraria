<style>
:root{--ink:#202c23;--muted:#788078;--line:#e7e9e4;--paper:#f7f8f5;--white:#fff;--green:#286044;--lime:#d5e7a0;--amber:#9a6414;--red:#a43d37;--shadow:0 12px 32px #1e35200b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 28px}.logo{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:var(--green);color:#fff;font-size:20px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.navlabel{padding:10px 10px 8px;font-size:10px;color:#9aa098;font-weight:700;letter-spacing:1px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;color:#687169;padding:10px 11px;border-radius:9px;display:flex;gap:11px;align-items:center;font-weight:550}.nav button:hover,.nav button.active{background:#eff4ed;color:var(--green)}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.sidebottom b{color:var(--ink);display:block;font-size:12px;margin-bottom:3px}.main{min-width:0}.topbar{height:70px;padding:0 38px;border-bottom:1px solid var(--line);background:#ffffffa8;display:flex;align-items:center;justify-content:space-between}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:650}.topright{display:flex;align-items:center;gap:16px}.season{border:1px solid var(--line);border-radius:20px;padding:7px 11px;background:#fff;font-size:12px;color:#536056}.avatar{width:33px;height:33px;border-radius:50%;background:#e8edda;color:var(--green);display:grid;place-items:center;font-weight:700}.content{max-width:1300px;padding:34px 38px 56px;margin:auto}.welcome{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}.welcome h1{font-size:29px;letter-spacing:-1px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:600;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:hover{filter:brightness(.97)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{color:var(--green);font-size:18px}.statnum{font-size:26px;font-weight:680;letter-spacing:-.8px;margin:11px 0 1px}.statfoot{font-size:11px;color:var(--muted)}.dashboard{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}.panel{padding:20px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h2{font-size:15px;margin:0;letter-spacing:-.2px}.textlink{border:0;background:none;color:var(--green);font-size:12px;font-weight:650}.alert{display:flex;gap:12px;padding:13px;border-radius:9px;background:#fff7e9;border:1px solid #f2e5ca;margin-bottom:12px}.alert:last-child{margin-bottom:0}.alerticon{font-size:16px}.alert b{display:block;font-size:12px;margin:0 0 3px}.alert p{margin:0;color:#746850;font-size:11px}.alert.red{background:#fff1ef;border-color:#f0d8d4}.alert.red p{color:#82605d}.activity{display:grid;gap:0}.event{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f1ee}.event:last-child{border:0}.eventico{height:36px;width:36px;border-radius:10px;background:#f0f4eb;display:grid;place-items:center;font-size:16px}.eventtitle{font-size:12px;font-weight:650}.eventmeta{font-size:11px;color:var(--muted);margin-top:2px}.date{font-size:10px;color:var(--muted);white-space:nowrap}.pill{font-size:10px;border-radius:20px;padding:4px 8px;background:#edf4e9;color:var(--green);font-weight:650}.modules{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:19px}.module{padding:17px;min-height:139px;cursor:pointer;transition:transform .15s,border .15s}.module:hover{transform:translateY(-2px);border-color:#b9cbb8}.moduleicon{height:34px;width:34px;border-radius:10px;background:#eff4ed;display:grid;place-items:center;font-size:17px;margin-bottom:11px}.module h3{font-size:13px;margin:0 0 4px}.module p{font-size:11px;color:var(--muted);margin:0}.module .arrow{float:right;color:#8c968b}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-title h1{font-size:25px;letter-spacing:-.7px;margin:0}.page-title p{color:var(--muted);margin:4px 0 0}.toolbar{display:flex;gap:9px;margin-bottom:14px}.search{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;width:min(320px,100%)}.tablewrap{overflow:auto}.data-table{border-collapse:collapse;width:100%;min-width:650px;text-align:left}.data-table th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#899188;font-weight:650;padding:12px 13px;background:#fafbf9}.data-table td{padding:13px;border-top:1px solid #eff0ed;font-size:12px}.data-table td:first-child{font-weight:620}.tag{display:inline-block;background:#f0f3ed;border-radius:20px;padding:4px 8px;font-size:10px;color:#546252}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff;color:var(--ink)}.modalback{position:fixed;inset:0;background:#14221966;display:none;place-items:center;padding:18px;z-index:5}.modalback.show{display:grid}.modal{background:white;border-radius:14px;padding:23px;width:min(500px,100%);box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:18px}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}.modal p{font-size:12px;color:var(--muted)}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.toast{position:fixed;bottom:24px;right:24px;background:#263d2d;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);display:none;z-index:10;font-size:12px}.toast.show{display:block}.mobilemenu{display:none}
@media(max-width:900px){.shell{grid-template-columns:205px minmax(0,1fr)}.content{padding:28px 22px}.topbar{padding:0 22px}.stats,.modules{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard{grid-template-columns:1fr}}
@media(max-width:620px){.shell{display:block}.sidebar{position:fixed;z-index:4;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 32px #0001}.sidebar.open{transform:none}.mobilemenu{display:block;border:0;background:none;font-size:21px;margin-right:10px}.topbar{height:58px;padding:0 15px;justify-content:flex-start}.crumb{flex:1}.topright{gap:9px}.season{font-size:10px;padding:6px}.content{padding:24px 15px 40px}.welcome{align-items:flex-start;gap:14px;flex-direction:column}.welcome h1{font-size:25px}.actions{width:100%}.stats{gap:10px}.stat{padding:13px}.statnum{font-size:22px}.statfoot{font-size:10px}.modules{gap:10px}.module{padding:13px}.page-title{align-items:flex-start;gap:12px}.page-title h1{font-size:22px}}

.parcel-grid,.planning-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}.parcel-form-card,.parcel-records,.planning-form,.planning-list{padding:20px}.parcel-form-card h2,.parcel-records h2,.planning-form h2,.planning-list h2{font-size:15px;margin:0 0 5px}.parcel-form-card>p,.parcel-records>p,.planning-form>p,.planning-list>p{font-size:11px;color:var(--muted);margin:0 0 16px}.parcel-form-card .formrow{margin:14px 0}.parcel-records-list,.record-list{display:grid;gap:9px}.record-card{padding:12px;border:1px solid var(--line);border-radius:9px}.record-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.record-top strong{font-size:12px}.record-meta,.record-note{font-size:11px;color:var(--muted);margin-top:6px}.record-actions,.form-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}.tag.done{background:#e7f2e5;color:#286044}.planning-form .field input,.planning-form .field select{font-size:12px}.parcel-record{padding:12px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:space-between;gap:12px}.parcel-record strong{font-size:12px}.parcel-record small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.parcel-empty{padding:18px 12px;border:1px dashed #d9ded6;border-radius:9px;color:var(--muted);font-size:11px;text-align:center}.parcel-total{padding:10px 12px;border-radius:8px;background:#eff4ed;color:var(--green);font-size:12px;font-weight:650;margin:0 0 13px}.parcel-total small{display:block;color:#667665;font-size:10px;font-weight:400}.parcel-records-list .btn{flex:0 0 auto}@media(max-width:900px){.parcel-grid,.planning-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">✳</div><div><strong>Campo</strong><small>Gestione azienda agraria</small></div></div><div class="navlabel">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">⌂</span>Panoramica</button><button data-page="appezzamenti"><span class="ico">▦</span>Appezzamenti</button><button data-page="piano"><span class="ico">▧</span>Piano colturale</button><button data-page="programmazione"><span class="ico">◷</span>Programmazione operazioni</button><button data-page="magazzino"><span class="ico">▤</span>Magazzino</button><button data-page="fitosanitari"><span class="ico">♧</span>Fitosanitari</button><button data-page="campagna"><span class="ico">▧</span>Quaderno di campagna</button><button data-page="cantina"><span class="ico">◉</span>Registro di cantina</button></nav><div class="sidebottom"><b>Azienda agricola Rossi</b>Campagna 2025 / 2026<br>Ultima sincronizzazione: oggi</div></aside><main class="main"><header class="topbar"><button class="mobilemenu" id="menu">☰</button><div class="crumb">Azienda agricola Rossi <span style="padding:0 7px;color:#bbb">/</span> <b id="crumb">Panoramica</b></div><div class="topright"><span class="season">◷ &nbsp;Campagna 2025 / 2026</span><div class="avatar">DR</div></div></header><section class="content" id="view"></section></main></div><div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modaltitle">Nuova registrazione</h2><button class="close" id="close">×</button></div><p id="modaldesc">Aggiungi una voce al registro aziendale.</p><div class="formrow"><div class="field"><label>Data</label><input type="date" id="fdate"></div><div class="field"><label>Attività / prodotto</label><input id="fname" placeholder="Es. Trattamento vite"></div></div><div class="formrow"><div class="field"><label>Appezzamento / categoria</label><input id="fplace" placeholder="Es. Vigneto Nord"></div><div class="field"><label>Quantità / note</label><input id="fqty" placeholder="Es. 12 kg"></div></div><div class="modalfoot"><button class="btn" id="cancel">Annulla</button><button class="btn primary" id="save">Salva registrazione</button></div></div></div><div class="toast" id="toast"></div>

<script>
const modules={magazzino:{title:'Magazzino',desc:'Scorte, lotti e movimenti dei prodotti aziendali.',icon:'▤',add:'Registra movimento',columns:['Prodotto','Categoria','Disponibilità','Unità','Lotto / posizione','Stato'],rows:[['Urea 46%','Concime','480','kg','L-2408 · Deposito A','Disponibile'],['Rame metallo 20%','Fitosanitario','12','kg','L-2514 · Armadio 2','Disponibile'],['Cartoni vino 6 bottiglie','Materiali cantina','320','pz','C-2025 · Deposito B','Disponibile'],['Olio gasolio agricolo','Carburante','85','L','Serbatoio aziendale','Scorta bassa']]},fitosanitari:{title:'Prodotti fitosanitari',desc:'Registro dei prodotti, giacenze e controlli di conformità.',icon:'♧',add:'Aggiungi prodotto',columns:['Prodotto','Principio attivo','Giacenza','Scadenza','Lotto','Stato'],rows:[['Rame Flow','Rame idrossido','12 kg','31/08/2026','L-2514','Disponibile'],['Zolfo bagnabile','Zolfo','8 kg','30/06/2026','L-2391','Verificare'],['Olio minerale','Olio paraffinico','5 L','15/03/2027','L-2520','Disponibile']]},campagna:{title:'Quaderno di campagna',desc:'Attività, trattamenti, lavorazioni e raccolte per appezzamento.',icon:'▧',add:'Nuova attività',columns:['Data','Attività','Appezzamento','Prodotto / lavorazione','Operatore','Dettaglio'],rows:[['24/09/2025','Trattamento','Vigneto Nord','Rame Flow · 1,2 kg/ha','D. Rossi','Registro dimostrativo'],['20/09/2025','Lavorazione','Campo 3 · mais','Preparazione letto di semina','M. Bianchi','Registro dimostrativo'],['18/09/2025','Raccolta','Oliveto Ovest','Olive · 1.240 kg','D. Rossi','Registro dimostrativo']]},cantina:{title:'Registro di cantina',desc:'Movimenti, lavorazioni e giacenze dei prodotti enologici.',icon:'◉',add:'Registra operazione',columns:['Data','Operazione','Prodotto / partita','Quantità','Vasca / contenitore','Note'],rows:[['25/09/2025','Carico uve','Sangiovese · 2025','2.450 kg','Ricevimento','Da pesare'],['26/09/2025','Pigiatura','Sangiovese · 2025','2.410 kg','Vasca V03','Esempio'],['28/09/2025','Rimontaggio','Mosto rosso · V03','—','Vasca V03','Esempio']]}};
let current='dashboard';const view=document.getElementById('view');function dashboard(){return `<div class="welcome"><div><h1>Buongiorno, Diego 👋</h1><p>Ecco cosa succede oggi nella tua azienda.</p></div><div class="actions"><button class="btn" onclick="notify('Esportazione pronta per essere collegata ai registri aziendali.')">⇩ &nbsp;Esporta</button><button class="btn primary" onclick="openModal()">＋ &nbsp;Nuova registrazione</button></div></div><div class="grid stats"><div class="card stat"><div class="stathead">Prodotti in magazzino <span class="staticon">▤</span></div><div class="statnum">28</div><div class="statfoot">4 categorie gestite</div></div><div class="card stat"><div class="stathead">Appezzamenti attivi <span class="staticon">▧</span></div><div class="statnum">12</div><div class="statfoot">Superficie totale 34,6 ha</div></div><div class="card stat"><div class="stathead">Movimenti in campagna <span class="staticon">↗</span></div><div class="statnum">46</div><div class="statfoot">Dall’inizio della stagione</div></div><div class="card stat"><div class="stathead">Partite in cantina <span class="staticon">◉</span></div><div class="statnum">7</div><div class="statfoot">3 vasche in lavorazione</div></div></div><div class="grid dashboard"><div class="card panel"><div class="panelhead"><h2>Attività recenti</h2><button class="textlink" onclick="go('campagna')">Vedi quaderno →</button></div><div class="activity"><div class="event"><div class="eventico">♧</div><div><div class="eventtitle">Trattamento registrato · Vigneto Nord</div><div class="eventmeta">Rame Flow · 1,2 kg/ha</div></div><span class="date">24 set</span></div><div class="event"><div class="eventico">◉</div><div><div class="eventtitle">Carico uve · Sangiovese</div><div class="eventmeta">Partita 2025 · Vasca V03</div></div><span class="date">23 set</span></div><div class="event"><div class="eventico">▤</div><div><div class="eventtitle">Carico magazzino · Cartoni vino</div><div class="eventmeta">120 pezzi · Deposito B</div></div><span class="date">22 set</span></div><div class="event"><div class="eventico">▧</div><div><div class="eventtitle">Raccolta completata · Oliveto Ovest</div><div class="eventmeta">Olive · 1.240 kg</div></div><span class="date">18 set</span></div></div></div><div class="card panel"><div class="panelhead"><h2>Da controllare</h2><span class="pill">2 avvisi</span></div><div class="alert"><span class="alerticon">◷</span><div><b>Scadenza prodotto vicina</b><p>Zolfo bagnabile · scade il 30 giugno 2026</p></div></div><div class="alert red"><span class="alerticon">!</span><div><b>Scorta sotto soglia</b><p>Gasolio agricolo · 85 L disponibili</p></div></div></div></div><div class="grid modules">${Object.entries(modules).map(([key,m])=>`<article class="card module" onclick="go('${key}')"><span class="arrow">↗</span><div class="moduleicon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p></article>`).join('')}</div>`}
function modulePage(key){const m=modules[key];return `<div class="page-title"><div><h1>${m.title}</h1><p>${m.desc}</p></div><button class="btn primary" onclick="openModal('${key}')">＋ &nbsp;${m.add}</button></div><div class="toolbar"><input class="search" placeholder="⌕  Cerca nel registro…" oninput="filterRows(this.value)"><button class="btn" onclick="notify('Esportazione pronta per essere collegata ai registri aziendali.')">⇩ &nbsp;Esporta</button></div><div class="card tablewrap"><table class="data-table"><thead><tr>${m.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="rows">${m.rows.map(row=>`<tr>${row.map((cell,i)=>`<td>${i===row.length-1&&(cell==='Disponibile'||cell==='Scorta bassa'||cell==='Verificare')?`<span class="tag">${cell}</span>`:cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p style="font-size:11px;color:var(--muted);margin:12px 2px">Dati dimostrativi. Struttura pronta per collegare utenti, archiviazione e documenti aziendali.</p>`}
function getParcels(){try{return JSON.parse(localStorage.getItem('campo.appezzamenti')||'[]')}catch{return []}}
function getSaved(key){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}
function putSaved(key,items){localStorage.setItem(key,JSON.stringify(items))}
function plotList(){return `<datalist id="plot-options">${getParcels().map(p=>`<option value="${escapeHtml(p.name)}">`).join('')}</datalist>`}
function planPage(){const items=getSaved('campo.pianoColturale');const total=items.reduce((sum,p)=>sum+(Number(p.hectares)||0),0);return `<div class="page-title"><div><h1>Piano colturale</h1><p>Registra le colture previste per appezzamento e campagna agraria.</p></div></div><div class="planning-grid"><form class="card planning-form" onsubmit="event.preventDefault();saveCropPlan()"><h2>Nuova coltura</h2><p>Associa coltura, superficie e appezzamento.</p><div class="formrow"><div class="field"><label for="planseason">Campagna agraria *</label><input id="planseason" placeholder="Es. 2026/2027" required></div><div class="field"><label for="planplot">Appezzamento *</label><input id="planplot" list="plot-options" placeholder="Scegli o scrivi il nome" required>${plotList()}</div></div><div class="formrow"><div class="field"><label for="plancrop">Coltura *</label><input id="plancrop" placeholder="Es. Grano duro" required></div><div class="field"><label for="planvariety">Varietà</label><input id="planvariety" placeholder="Es. Senatore Cappelli"></div></div><div class="formrow"><div class="field"><label for="planarea">Superficie (ettari) *</label><input id="planarea" type="number" min="0.0001" step="0.0001" placeholder="Es. 2,5" required></div><div class="field"><label for="plannote">Note</label><input id="plannote" placeholder="Semina, rotazione, note"></div></div><div class="form-actions"><button class="btn primary" type="submit">＋ &nbsp;Aggiungi al piano</button></div></form><section class="card planning-list"><h2>Colture pianificate</h2><p>${items.length} voci · ${total.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:4})} ha pianificati</p><div class="record-list">${items.length?items.map(p=>`<article class="record-card"><div class="record-top"><strong>${escapeHtml(p.crop)}</strong><span class="tag">${escapeHtml(p.season)}</span></div><div class="record-meta">${escapeHtml(p.plot)} · ${Number(p.hectares).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:4})} ha${p.variety?' · '+escapeHtml(p.variety):''}</div>${p.note?`<div class="record-note">${escapeHtml(p.note)}</div>`:''}<button class="textlink" data-delete-plan="${escapeHtml(p.id)}">Rimuovi</button></article>`).join(''):'<div class="parcel-empty">Nessuna coltura pianificata.<br>Inserisci la prima voce qui accanto.</div>'}</div></section></div>`}
function operationsPage(){const items=getSaved('campo.programmazione').slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-title"><div><h1>Programmazione operazioni in campo</h1><p>Pianifica le lavorazioni e aggiorna lo stato man mano che vengono svolte.</p></div></div><div class="planning-grid"><form class="card planning-form" onsubmit="event.preventDefault();saveOperation()"><h2>Nuova operazione</h2><p>Inserisci quando e dove è previsto il lavoro.</p><div class="formrow"><div class="field"><label for="opdate">Data prevista *</label><input id="opdate" type="date" required></div><div class="field"><label for="opplot">Appezzamento *</label><input id="opplot" list="plot-options" placeholder="Scegli o scrivi il nome" required>${plotList()}</div></div><div class="formrow"><div class="field"><label for="optype">Operazione *</label><select id="optype" required><option value="">Seleziona operazione</option><option>Preparazione terreno</option><option>Semina / trapianto</option><option>Concimazione</option><option>Irrigazione</option><option>Trattamento</option><option>Potatura</option><option>Raccolta</option><option>Altra lavorazione</option></select></div><div class="field"><label for="opcrop">Coltura</label><input id="opcrop" placeholder="Es. Vite"></div></div><div class="formrow"><div class="field"><label for="opresponsible">Responsabile</label><input id="opresponsible" placeholder="Nome operatore"></div><div class="field"><label for="opnotes">Note / attrezzatura</label><input id="opnotes" placeholder="Trattore, materiali, indicazioni"></div></div><div class="form-actions"><button class="btn primary" type="submit">＋ &nbsp;Programma operazione</button></div></form><section class="card planning-list"><h2>Operazioni programmate</h2><p>${items.length} in agenda</p><div class="record-list">${items.length?items.map(o=>`<article class="record-card"><div class="record-top"><strong>${escapeHtml(o.operation)}</strong><span class="tag ${o.status==='Completata'?'done':''}">${escapeHtml(o.status)}</span></div><div class="record-meta">${new Date(o.date+'T00:00:00').toLocaleDateString('it-IT')} · ${escapeHtml(o.plot)}${o.crop?' · '+escapeHtml(o.crop):''}</div><div class="record-note">${o.responsible?'Responsabile: '+escapeHtml(o.responsible):''}${o.notes?(o.responsible?' · ':'')+escapeHtml(o.notes):''}</div><div class="record-actions"><button class="textlink" data-toggle-op="${escapeHtml(o.id)}">${o.status==='Completata'?'Segna da fare':'Segna completata'}</button><button class="textlink" data-delete-op="${escapeHtml(o.id)}">Rimuovi</button></div></article>`).join(''):'<div class="parcel-empty">Nessuna operazione in agenda.<br>Aggiungi la prima attività qui accanto.</div>'}</div></section></div>`}
function saveCropPlan(){const season=document.getElementById('planseason').value.trim(),plot=document.getElementById('planplot').value.trim(),crop=document.getElementById('plancrop').value.trim(),hectares=Number(document.getElementById('planarea').value);if(!season||!plot||!crop||!Number.isFinite(hectares)||hectares<=0){notify('Compila campagna, appezzamento, coltura e superficie.');return}const items=getSaved('campo.pianoColturale');items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),season,plot,crop,variety:document.getElementById('planvariety').value.trim(),hectares,note:document.getElementById('plannote').value.trim()});putSaved('campo.pianoColturale',items);go('piano');notify('Coltura aggiunta al piano.') }
function saveOperation(){const date=document.getElementById('opdate').value,plot=document.getElementById('opplot').value.trim(),operation=document.getElementById('optype').value;if(!date||!plot||!operation){notify('Compila data, appezzamento e operazione.');return}const items=getSaved('campo.programmazione');items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,plot,operation,crop:document.getElementById('opcrop').value.trim(),responsible:document.getElementById('opresponsible').value.trim(),notes:document.getElementById('opnotes').value.trim(),status:'Programmata'});putSaved('campo.programmazione',items);go('programmazione');notify('Operazione aggiunta all’agenda.') }
function bindPlanningActions(){view.querySelectorAll('[data-delete-plan]').forEach(b=>b.addEventListener('click',()=>{putSaved('campo.pianoColturale',getSaved('campo.pianoColturale').filter(x=>x.id!==b.dataset.deletePlan));go('piano')}));view.querySelectorAll('[data-toggle-op]').forEach(b=>b.addEventListener('click',()=>{const items=getSaved('campo.programmazione');const item=items.find(x=>x.id===b.dataset.toggleOp);if(item)item.status=item.status==='Completata'?'Programmata':'Completata';putSaved('campo.programmazione',items);go('programmazione')}));view.querySelectorAll('[data-delete-op]').forEach(b=>b.addEventListener('click',()=>{putSaved('campo.programmazione',getSaved('campo.programmazione').filter(x=>x.id!==b.dataset.deleteOp));go('programmazione')}))}
function saveParcels(items){localStorage.setItem('campo.appezzamenti',JSON.stringify(items))}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parcelPage(){const items=getParcels();const total=items.reduce((sum,p)=>sum+(Number(p.hectares)||0),0);return `<div class="page-title"><div><h1>Appezzamenti</h1><p>Registra i terreni dell’azienda e tieni sotto controllo colture e superfici.</p></div></div><div class="parcel-grid"><section class="card parcel-form-card"><h2>Nuovo appezzamento</h2><p>Inserisci i dati principali del terreno.</p><div class="field"><label for="parcelname">Nome appezzamento *</label><input id="parcelname" placeholder="Es. Vigneto Nord" maxlength="80"></div><div class="formrow"><div class="field"><label for="parcelcrop">Coltura</label><input id="parcelcrop" placeholder="Es. Vite" maxlength="60"></div><div class="field"><label for="parcelhectares">Superficie (ettari) *</label><input id="parcelhectares" type="number" min="0.0001" step="0.0001" placeholder="Es. 2,5"></div></div><div class="field"><label for="parcelref">Riferimento / note</label><input id="parcelref" placeholder="Es. Particella, località" maxlength="120"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="saveParcel()">＋ &nbsp;Salva appezzamento</button></div></section><section class="card parcel-records"><h2>I tuoi appezzamenti</h2><p>${items.length} registrati</p><div class="parcel-total">Superficie totale: ${total.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:4})} ha <small>La somma si aggiorna quando aggiungi o rimuovi un terreno.</small></div><div class="parcel-records-list">${items.length?items.map(p=>`<div class="parcel-record"><div><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.crop||'Coltura non indicata')} · ${Number(p.hectares||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:4})} ha${p.reference?' · '+escapeHtml(p.reference):''}</small></div><button class="btn" data-delete-parcel="${escapeHtml(p.id)}">Rimuovi</button></div>`).join(''):'<div class="parcel-empty">Non hai ancora inserito appezzamenti.</div>'}</div></section></div>`}
function saveParcel(){const name=document.getElementById('parcelname').value.trim();const crop=document.getElementById('parcelcrop').value.trim();const hectares=Number(document.getElementById('parcelhectares').value);const reference=document.getElementById('parcelref').value.trim();if(!name){document.getElementById('parcelname').focus();notify('Inserisci il nome dell’appezzamento.');return}if(!Number.isFinite(hectares)||hectares<=0){document.getElementById('parcelhectares').focus();notify('Inserisci una superficie in ettari maggiore di zero.');return}const items=getParcels();items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,crop,hectares,reference});saveParcels(items);go('appezzamenti');notify('Appezzamento salvato su questo dispositivo.')}
function removeParcel(id){if(!confirm('Vuoi rimuovere questo appezzamento?'))return;saveParcels(getParcels().filter(p=>p.id!==id));go('appezzamenti')}
function bindParcelActions(){view.querySelectorAll('[data-delete-parcel]').forEach(button=>button.addEventListener('click',()=>removeParcel(button.dataset.deleteParcel)))}
function go(key){current=key;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===key));const names={dashboard:'Panoramica',appezzamenti:'Appezzamenti',piano:'Piano colturale',programmazione:'Programmazione operazioni'};document.getElementById('crumb').textContent=names[key]||modules[key].title;view.innerHTML=key==='dashboard'?dashboard():key==='appezzamenti'?parcelPage():key==='piano'?planPage():key==='programmazione'?operationsPage():modulePage(key);document.getElementById('sidebar').classList.remove('open');if(key==='appezzamenti')bindParcelActions();if(key==='piano'||key==='programmazione')bindPlanningActions()}
function openModal(key=current){const m=modules[key];document.getElementById('modaltitle').textContent=m?m.add:'Nuova registrazione';document.getElementById('modaldesc').textContent=m?m.desc:'Scegli il registro in cui inserire l’attività.';document.getElementById('fdate').value=new Date().toISOString().slice(0,10);document.getElementById('fname').value='';document.getElementById('fplace').value='';document.getElementById('fqty').value='';document.getElementById('modalback').classList.add('show');document.getElementById('save').dataset.key=m?key:''}function closeModal(){document.getElementById('modalback').classList.remove('show')}function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function filterRows(q){document.querySelectorAll('#rows tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('close').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};document.getElementById('save').onclick=()=>{const name=document.getElementById('fname').value.trim();if(!name){document.getElementById('fname').focus();return}const key=document.getElementById('save').dataset.key;closeModal();notify('Registrazione acquisita nel prototipo. Per conservarla tra le sessioni serve collegare un archivio dati.');if(key&&current===key){const m=modules[key],row=[document.getElementById('fdate').value,name,document.getElementById('fplace').value||'—',document.getElementById('fqty').value||'—','Nuova voce'];const tr=document.createElement('tr');row.slice(0,m.columns.length).forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td)});document.getElementById('rows').prepend(tr)}};go('dashboard');
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="cloud-app.js"></script>
</body></html>
